<script>
const pages = {"home":"\u003ca class=\"skip\" href=\"#main\">Skip to content\u003c/a>\u003cheader>\u003ca class=\"wordmark\" href=\"index.html\" aria-label=\"Tiffany Legg home\">tl\u003cspan> / \u003c/span>Tiffany Legg\u003c/a>\u003cnav aria-label=\"Main navigation\">\u003ca href=\"index.html#work\">Selected work\u003c/a>\u003ca href=\"index.html#about\">Experience\u003c/a>\u003ca href=\"index.html#contact\">Let’s connect ↗\u003c/a>\u003c/nav>\u003c/header>\u003cmain id=\"main\">\u003csection class=\"hero\">\u003cdiv>\u003cp class=\"eyebrow\">Operations leadership / Business systems / Creative technology\u003c/p>\u003ch1>I connect the\u003cbr>business to\u003cbr>\u003cem>the build.\u003c/em>\u003c/h1>\u003cp class=\"lead\">I’m Tiffany Legg. I turn operational needs into thoughtful workflows, useful applications, and a consistent customer experience.\u003c/p>\u003cdiv class=\"actions\">\u003ca class=\"button\" href=\"#work\">Explore selected work \u003cspan>↘\u003c/span>\u003c/a>\u003ca class=\"text-link\" href=\"#about\">The experience behind it →\u003c/a>\u003c/div>\u003c/div>\u003caside class=\"hero-note\">\u003cspan class=\"note-number\">01—04\u003c/span>\u003cp class=\"eyebrow\">A portfolio of connected work\u003c/p>\u003cdiv class=\"orbit\">\u003cspan>BUSINESS\u003cbr>NEEDS\u003c/span>\u003cb>×\u003c/b>\u003cspan>USEFUL\u003cbr>SYSTEMS\u003c/span>\u003c/div>\u003cp>From the first customer touchpoint to the records and processes behind the work.\u003c/p>\u003cdiv class=\"note-line\">\u003cspan>Based in Northeast Ohio\u003c/span>\u003cspan>↗\u003c/span>\u003c/div>\u003c/aside>\u003c/section>\u003csection class=\"intro-band\">\u003cp>Operational perspective.\u003cbr>\u003cem>Technical follow-through.\u003c/em>\u003c/p>\u003cp>Current Capital One IRA operations experience, combined with cross-functional leadership at Mow Magic across business systems, web development, brand, marketing, and process documentation.\u003c/p>\u003c/section>\u003csection id=\"work\" class=\"work\">\u003cdiv class=\"section-heading\">\u003cdiv>\u003cp class=\"eyebrow\">01 / Selected work\u003c/p>\u003ch2>Systems with a purpose.\u003c/h2>\u003c/div>\u003cp>Business context, implementation decisions,\u003cbr>and evidence you can examine.\u003c/p>\u003c/div>\u003cdiv class=\"filters\" hidden role=\"group\" aria-label=\"Filter projects\">\u003cbutton aria-pressed=\"true\" data-filter=\"all\">All work\u003c/button>\u003cbutton aria-pressed=\"false\" data-filter=\"operations\">Operations\u003c/button>\u003cbutton aria-pressed=\"false\" data-filter=\"systems\">Business systems\u003c/button>\u003cbutton aria-pressed=\"false\" data-filter=\"design\">Brand & experience\u003c/button>\u003c/div>\u003cp id=\"filter-result\" class=\"sr-only\" aria-live=\"polite\">\u003c/p>\u003cdiv class=\"projects\">\u003carticle class=\"project\" data-tags=\"operations systems design\">\u003ca class=\"project-art\" href=\"work/mow-magic/index.html\" aria-label=\"Read Mow Magic case study\">\u003cdiv class=\"system-map mow-magic\" aria-label=\"Conceptual project structure\">\u003cdiv class=\"map-top\">\u003cspan>FIELD NOTES / MOW-MAGIC\u003c/span>\u003cspan>↗\u003c/span>\u003c/div>\u003cdiv class=\"map-mark\">M / M\u003c/div>\u003cdiv class=\"map-nodes\">\u003cspan>\u003ci>01\u003c/i>Customer intake\u003c/span>\u003cspan>\u003ci>02\u003c/i>Lead record\u003c/span>\u003cspan>\u003ci>03\u003c/i>Service planning\u003c/span>\u003cspan>\u003ci>04\u003c/i>Field coordination\u003c/span>\u003c/div>\u003csmall>Conceptual structure · not an application screenshot\u003c/small>\u003c/div>\u003c/a>\u003cdiv class=\"project-info\">\u003cspan class=\"eyebrow\">01 / Operations &amp; business systems\u003c/span>\u003ch3>\u003ca href=\"work/mow-magic/index.html\">Mow Magic \u003cspan>↗\u003c/span>\u003c/a>\u003c/h3>\u003cp>Connecting a service business’s brand, customer intake, CRM, and field-service workflows.\u003c/p>\u003cp class=\"micro\">Next.js · JavaScript · Firebase/Firestore · Supabase · PHP\u003c/p>\u003cspan class=\"status\">Source implementations\u003c/span>\u003c/div>\u003c/article>\u003carticle class=\"project\" data-tags=\"systems design\">\u003ca class=\"project-art\" href=\"work/everfold/index.html\" aria-label=\"Read Everfold case study\">\u003cdiv class=\"system-map everfold\" aria-label=\"Conceptual project structure\">\u003cdiv class=\"map-top\">\u003cspan>FIELD NOTES / EVERFOLD\u003c/span>\u003cspan>↗\u003c/span>\u003c/div>\u003cdiv class=\"map-mark\">e.\u003c/div>\u003cdiv class=\"map-nodes\">\u003cspan>\u003ci>01\u003c/i>Template definition\u003c/span>\u003cspan>\u003ci>02\u003c/i>Pinned version\u003c/span>\u003cspan>\u003ci>03\u003c/i>Invitation blocks\u003c/span>\u003cspan>\u003ci>04\u003c/i>Recipient experience\u003c/span>\u003c/div>\u003csmall>Conceptual structure · not an application screenshot\u003c/small>\u003c/div>\u003c/a>\u003cdiv class=\"project-info\">\u003cspan class=\"eyebrow\">02 / Product architecture &amp; experience\u003c/span>\u003ch3>\u003ca href=\"work/everfold/index.html\">Everfold \u003cspan>↗\u003c/span>\u003c/a>\u003c/h3>\u003cp>An invitation product with reusable themes, versioned templates, a builder, and host workflows.\u003c/p>\u003cp class=\"micro\">TypeScript · React · TanStack Start · Tailwind · Vitest\u003c/p>\u003cspan class=\"status\">Application in development\u003c/span>\u003c/div>\u003c/article>\u003carticle class=\"project\" data-tags=\"design systems\">\u003ca class=\"project-art\" href=\"work/runhouse/index.html\" aria-label=\"Read RunHouse Digital case study\">\u003cdiv class=\"system-map runhouse\" aria-label=\"Conceptual project structure\">\u003cdiv class=\"map-top\">\u003cspan>FIELD NOTES / RUNHOUSE\u003c/span>\u003cspan>↗\u003c/span>\u003c/div>\u003cdiv class=\"map-mark\">R / H\u003c/div>\u003cdiv class=\"map-nodes\">\u003cspan>\u003ci>01\u003c/i>Project package\u003c/span>\u003cspan>\u003ci>02\u003c/i>Optional add-ons\u003c/span>\u003cspan>\u003ci>03\u003c/i>Maintenance\u003c/span>\u003cspan>\u003ci>04\u003c/i>Estimate breakdown\u003c/span>\u003c/div>\u003csmall>Conceptual structure · not an application screenshot\u003c/small>\u003c/div>\u003c/a>\u003cdiv class=\"project-info\">\u003cspan class=\"eyebrow\">03 / Web experience &amp; interaction design\u003c/span>\u003ch3>\u003ca href=\"work/runhouse/index.html\">RunHouse Digital \u003cspan>↗\u003c/span>\u003c/a>\u003c/h3>\u003cp>A service-business web experience with a configurable project estimator and transparent cost breakdown.\u003c/p>\u003cp class=\"micro\">React · TypeScript · Vite · Tailwind · Wouter\u003c/p>\u003cspan class=\"status\">Frontend prototype\u003c/span>\u003c/div>\u003c/article>\u003carticle class=\"project\" data-tags=\"design systems\">\u003ca class=\"project-art\" href=\"work/design-system/index.html\" aria-label=\"Read Mow Magic Design System case study\">\u003cdiv class=\"system-map design-system\" aria-label=\"Conceptual project structure\">\u003cdiv class=\"map-top\">\u003cspan>FIELD NOTES / DESIGN-SYSTEM\u003c/span>\u003cspan>↗\u003c/span>\u003c/div>\u003cdiv class=\"map-mark\">Aa\u003c/div>\u003cdiv class=\"map-nodes\">\u003cspan>\u003ci>01\u003c/i>Brand tokens\u003c/span>\u003cspan>\u003ci>02\u003c/i>Presentational layer\u003c/span>\u003cspan>\u003ci>03\u003c/i>Version contract\u003c/span>\u003cspan>\u003ci>04\u003c/i>Application reuse\u003c/span>\u003c/div>\u003csmall>Conceptual structure · not an application screenshot\u003c/small>\u003c/div>\u003c/a>\u003cdiv class=\"project-info\">\u003cspan class=\"eyebrow\">04 / Brand systems &amp; maintainability\u003c/span>\u003ch3>\u003ca href=\"work/design-system/index.html\">Mow Magic Design System \u003cspan>↗\u003c/span>\u003c/a>\u003c/h3>\u003cp>A data-free brand layer shared by public marketing and private operational applications.\u003c/p>\u003cp class=\"micro\">CSS tokens · Web components · Versioned releases\u003c/p>\u003cspan class=\"status\">Reusable source package\u003c/span>\u003c/div>\u003c/article>\u003c/div>\u003cdiv class=\"evidence-note\">\u003cstrong>Clear evidence. Honest scope.\u003c/strong>\u003cp>Projects are labeled by what has been inspected: source implementations, development work, and prototypes. No live deployment or measured business result is implied. The diagrams are conceptual exhibits, not screenshots.\u003c/p>\u003c/div>\u003c/section>\u003csection id=\"about\" class=\"about\">\u003cdiv>\u003cp class=\"eyebrow\">02 / Experience & capabilities\u003c/p>\u003ch2>The person behind\u003cbr>\u003cem>the systems.\u003c/em>\u003c/h2>\u003cp class=\"lead\">I work across the details that connect an organization: people, processes, records, interfaces, and brand.\u003c/p>\u003cp>My Mow Magic responsibilities extend from operational planning and SOPs to website management, CRM requirements, custom applications, content, promotions, and visual identity. I lead development by connecting business requirements to practical implementation.\u003c/p>\u003cp>I use the portfolio to make that work assessable, without claiming sole authorship of every component.\u003c/p>\u003c/div>\u003cdiv class=\"experience\">\u003csection>\u003cspan class=\"eyebrow\">Current / Financial operations\u003c/span>\u003ch3>Capital One\u003c/h3>\u003cp>IRA / retirement account operations. A foundation in structured account work and careful operational recordkeeping.\u003c/p>\u003c/section>\u003csection>\u003cspan class=\"eyebrow\">Cross-functional leadership\u003c/span>\u003ch3>Mow Magic Landscaping & Snow Removal LLC\u003c/h3>\u003cp>COO & Director of Operations, Corporate & Environmental Compliance — user-confirmed role. Operations, business systems, web development, brand, and marketing.\u003c/p>\u003c/section>\u003csection>\u003cspan class=\"eyebrow\">Capabilities demonstrated in the work\u003c/span>\u003cul class=\"skills\">\u003cli>Workflow & requirements design\u003c/li>\u003cli>CRM & customer records\u003c/li>\u003cli>SOPs & process documentation\u003c/li>\u003cli>Web & application delivery\u003c/li>\u003cli>Brand systems & content\u003c/li>\u003cli>Reusable UI & structured data\u003c/li>\u003c/ul>\u003cp class=\"micro\">Project stacks reflect inspected repositories, rather than certifications or a claim of equal proficiency in every technology.\u003c/p>\u003c/section>\u003c/div>\u003c/section>\u003csection class=\"method\">\u003cp class=\"eyebrow\">03 / How I approach the work\u003c/p>\u003cdiv class=\"method-grid\">\u003cdiv>\u003cspan>01\u003c/span>\u003ch3>Understand the operation.\u003c/h3>\u003cp>Start with the people, decisions, records, and handoffs the system needs to support.\u003c/p>\u003c/div>\u003cdiv>\u003cspan>02\u003c/span>\u003ch3>Make the structure clear.\u003c/h3>\u003cp>Define reusable data, workflows, and interface patterns around those needs.\u003c/p>\u003c/div>\u003cdiv>\u003cspan>03\u003c/span>\u003ch3>Show the evidence.\u003c/h3>\u003cp>Explain the choices, inspect the implementation, and separate what exists from what still needs validation.\u003c/p>\u003c/div>\u003c/div>\u003c/section>\u003csection id=\"contact\" class=\"contact\">\u003cp class=\"eyebrow\">04 / Let’s connect\u003c/p>\u003ch2>Bring the business\u003cbr>and the build \u003cem>together.\u003c/em>\u003c/h2>\u003cp>I’m interested in operations leadership, business systems, CRM, automation, and technology opportunities.\u003c/p>\u003cdiv class=\"actions\">\u003ca class=\"button\" href=\"mailto:tifflegg93@gmail.com\">Email me ↗\u003c/a>\u003ca class=\"text-link\" href=\"https://github.com/Ladybugverse\">Find me on GitHub ↗\u003c/a>\u003c/div>\u003cp class=\"micro\">For employer inquiries: \u003ca href=\"mailto:tifflegg93@gmail.com\">tifflegg93@gmail.com\u003c/a>\u003c/p>\u003c/section>\u003c/main>\u003cfooter>\u003cspan>Tiffany Legg / Operations × Technology\u003c/span>\u003cspan>Parma Heights, Ohio · © 2026\u003c/span>\u003ca href=\"https://github.com/Ladybugverse/personal-website\">Portfolio source ↗\u003c/a>\u003c/footer>","mow-magic":"\u003ca class=\"skip\" href=\"#main\">Skip to content\u003c/a>\u003cheader>\u003ca class=\"wordmark\" href=\"../../index.html\" aria-label=\"Tiffany Legg home\">tl\u003cspan> / \u003c/span>Tiffany Legg\u003c/a>\u003cnav aria-label=\"Main navigation\">\u003ca href=\"../../index.html#work\">Selected work\u003c/a>\u003ca href=\"../../index.html#about\">Experience\u003c/a>\u003ca href=\"../../index.html#contact\">Let’s connect ↗\u003c/a>\u003c/nav>\u003c/header>\u003cmain id=\"main\">\u003cdiv class=\"case-hero\">\u003ca class=\"back\" href=\"../../index.html#work\">← All selected work\u003c/a>\u003cp class=\"eyebrow\">Operations &amp; business systems\u003c/p>\u003ch1>Mow Magic\u003cspan class=\"period\">.\u003c/span>\u003c/h1>\u003cp class=\"lead\">Connecting a service business’s brand, customer intake, CRM, and field-service workflows.\u003c/p>\u003cspan class=\"status\">Source implementations · Deployment unverified\u003c/span>\u003c/div>\u003cdiv class=\"case-grid\">\u003caside>\u003ch2 class=\"eyebrow\">At a glance\u003c/h2>\u003ch3>Role & contribution\u003c/h3>\u003cp>Operations, requirements, brand and marketing ownership; led website and custom application development.\u003c/p>\u003ch3>Technology in the source\u003c/h3>\u003cp>Next.js · JavaScript · Firebase/Firestore · Supabase · PHP\u003c/p>\u003ch3>Business problem\u003c/h3>\u003cp>Support both the customer experience and the records needed to estimate, schedule, perform, and document landscaping and snow-removal work.\u003c/p>\u003cp class=\"micro\">Evidence reviewed October 14, 2026. Source code establishes implementation, not production use.\u003c/p>\u003c/aside>\u003carticle>\u003cdiv class=\"system-map mow-magic\" aria-label=\"Conceptual project structure\">\u003cdiv class=\"map-top\">\u003cspan>FIELD NOTES / MOW-MAGIC\u003c/span>\u003cspan>↗\u003c/span>\u003c/div>\u003cdiv class=\"map-mark\">M / M\u003c/div>\u003cdiv class=\"map-nodes\">\u003cspan>\u003ci>01\u003c/i>Customer intake\u003c/span>\u003cspan>\u003ci>02\u003c/i>Lead record\u003c/span>\u003cspan>\u003ci>03\u003c/i>Service planning\u003c/span>\u003cspan>\u003ci>04\u003c/i>Field coordination\u003c/span>\u003c/div>\u003csmall>Conceptual structure · not an application screenshot\u003c/small>\u003c/div>\u003csection class=\"prose\">\u003ch2>One business. Several connected needs.\u003c/h2>\u003cp>My responsibilities span website creation and management, brand identity and logo, content, social media, promotions, apparel, SOPs, custom applications, CRM, and business records. The work combines operational requirements with creative and technical delivery.\u003c/p>\u003c/section>\u003csection class=\"prose\">\u003ch2>Public intake with a persistent record\u003c/h2>\u003cp>The Next.js source implements service content, lead validation and persistence, campaign attribution, QR routes, and optional private photo intake. Notification handling preserves a saved lead when email delivery fails. That decision separates record integrity from notification availability.\u003c/p>\u003c/section>\u003csection class=\"prose\">\u003ch2>An operational view of the customer\u003c/h2>\u003cp>A separate team application contains Firestore-connected client, lead, property, calendar, estimate, invoice, expense, vendor, and equipment workflows. Structured property and service records represent information needed before and after a visit.\u003c/p>\u003c/section>\u003csection class=\"prose\">\u003ch2>A lightweight estimate alternative\u003c/h2>\u003cp>The branded microsite is a separate implementation. Its PHP endpoint validates requests, recalculates estimates on the server, and stores lead records. Public marketing and internal operations have different data and access needs; the repositories keep those concerns separate.\u003c/p>\u003c/section>\u003csection class=\"prose\">\u003ch2>Brand and process belong in the system\u003c/h2>\u003cp>My work also includes the visual identity, promotional materials, apparel, process documentation, and records. Shared styling and configurable service content support consistency across touchpoints.\u003c/p>\u003c/section>\u003csection class=\"prose\">\u003ch2>What the evidence demonstrates\u003c/h2>\u003cp>The deliverable is a body of implemented business software plus confirmed operational and creative responsibility. It demonstrates requirements translation, customer-record modeling, workflow design, and cross-functional ownership. Revenue gains, time savings, staff adoption, and end-to-end production performance have not been measured here.\u003c/p>\u003c/section>\u003csection class=\"boundary\">\u003cp class=\"eyebrow\">Implementation status\u003c/p>\u003ch2>What still needs verification\u003c/h2>\u003cp>Deployment, applied migrations, production access controls, and customer/staff usage are unverified. The Next.js private portal, payments, approvals, crew dashboard, admin preview, and CSV export are documented as disabled. The team README’s PIN warning conflicts with newer authentication code; production security remains unverified. Automatic transfer between these applications is not established.\u003c/p>\u003c/section>\u003csection class=\"prose\">\u003ch2>Implementation evidence\u003c/h2>\u003cp>Private project links require repository access. No private source code, customer records, or credentials are reproduced here.\u003c/p>\u003cul class=\"evidence\">\u003cli>\u003ca href=\"https://github.com/Ladybugverse/mow_magic_site/blob/main/app/api/leads/route.ts\">Next.js lead intake ↗\u003c/a>\u003csmall>Access restricted · available to authorized reviewers\u003c/small>\u003c/li>\u003cli>\u003ca href=\"https://github.com/Ladybugverse/mow_magic_site/blob/main/KNOWN_LIMITATIONS.md\">Documented limitations ↗\u003c/a>\u003csmall>Access restricted · available to authorized reviewers\u003c/small>\u003c/li>\u003cli>\u003ca href=\"https://github.com/Ladybugverse/mow-magic-team-system/blob/main/public/index.html\">Team application ↗\u003c/a>\u003csmall>Access restricted · available to authorized reviewers\u003c/small>\u003c/li>\u003cli>\u003ca href=\"https://github.com/Ladybugverse/mow-magic-team-system/blob/main/README.md\">Team workflow scope ↗\u003c/a>\u003csmall>Access restricted · available to authorized reviewers\u003c/small>\u003c/li>\u003cli>\u003ca href=\"https://app.notion.com/p/f9f3acdf1d2445209d055a94815e8dc2\">Original case study ↗\u003c/a>\u003csmall>Access restricted · available to authorized reviewers\u003c/small>\u003c/li>\u003c/ul>\u003c/section>\u003ca class=\"button\" href=\"../../index.html#contact\">Discuss this work ↗\u003c/a>\u003c/article>\u003c/div>\u003c/main>\u003cfooter>\u003cspan>Tiffany Legg / Operations × Technology\u003c/span>\u003cspan>Parma Heights, Ohio · © 2026\u003c/span>\u003ca href=\"https://github.com/Ladybugverse/personal-website\">Portfolio source ↗\u003c/a>\u003c/footer>","everfold":"\u003ca class=\"skip\" href=\"#main\">Skip to content\u003c/a>\u003cheader>\u003ca class=\"wordmark\" href=\"../../index.html\" aria-label=\"Tiffany Legg home\">tl\u003cspan> / \u003c/span>Tiffany Legg\u003c/a>\u003cnav aria-label=\"Main navigation\">\u003ca href=\"../../index.html#work\">Selected work\u003c/a>\u003ca href=\"../../index.html#about\">Experience\u003c/a>\u003ca href=\"../../index.html#contact\">Let’s connect ↗\u003c/a>\u003c/nav>\u003c/header>\u003cmain id=\"main\">\u003cdiv class=\"case-hero\">\u003ca class=\"back\" href=\"../../index.html#work\">← All selected work\u003c/a>\u003cp class=\"eyebrow\">Product architecture &amp; experience\u003c/p>\u003ch1>Everfold\u003cspan class=\"period\">.\u003c/span>\u003c/h1>\u003cp class=\"lead\">An invitation product with reusable themes, versioned templates, a builder, and host workflows.\u003c/p>\u003cspan class=\"status\">Application in development · Deployment unverified\u003c/span>\u003c/div>\u003cdiv class=\"case-grid\">\u003caside>\u003ch2 class=\"eyebrow\">At a glance\u003c/h2>\u003ch3>Role & contribution\u003c/h3>\u003cp>Product concept and experience direction. Repository inspection supports implementation details; individual code authorship is not asserted.\u003c/p>\u003ch3>Technology in the source\u003c/h3>\u003cp>TypeScript · React · TanStack Start · Tailwind · Vitest\u003c/p>\u003ch3>Business problem\u003c/h3>\u003cp>Make expressive invitation experiences reusable while protecting already-created invitations from later template changes.\u003c/p>\u003cp class=\"micro\">Evidence reviewed October 14, 2026. Source code establishes implementation, not production use.\u003c/p>\u003c/aside>\u003carticle>\u003cdiv class=\"system-map everfold\" aria-label=\"Conceptual project structure\">\u003cdiv class=\"map-top\">\u003cspan>FIELD NOTES / EVERFOLD\u003c/span>\u003cspan>↗\u003c/span>\u003c/div>\u003cdiv class=\"map-mark\">e.\u003c/div>\u003cdiv class=\"map-nodes\">\u003cspan>\u003ci>01\u003c/i>Template definition\u003c/span>\u003cspan>\u003ci>02\u003c/i>Pinned version\u003c/span>\u003cspan>\u003ci>03\u003c/i>Invitation blocks\u003c/span>\u003cspan>\u003ci>04\u003c/i>Recipient experience\u003c/span>\u003c/div>\u003csmall>Conceptual structure · not an application screenshot\u003c/small>\u003c/div>\u003csection class=\"prose\">\u003ch2>A product beyond the invitation\u003c/h2>\u003cp>The repository includes builder, recipient invitation, guest, dashboard, template-studio, and theme-studio routes. These show an application implementation rather than only a visual concept. Route presence alone does not prove a finished or deployed flow.\u003c/p>\u003c/section>\u003csection class=\"prose\">\u003ch2>A deliberate template boundary\u003c/h2>\u003cp>The inspected applyTemplateVersion function copies a template definition into an invitation and records a template/version pin. Republishing a template therefore does not have to mutate invitations already created from it. Themes and structured blocks support reuse without hardcoding each event.\u003c/p>\u003c/section>\u003csection class=\"prose\">\u003ch2>Saving is part of the experience\u003c/h2>\u003cp>Inspected tests cover delayed backend confirmation, failed writes, missing rows, retries, and draft/publish ordering. These are meaningful failure scenarios for a builder: an interface should not imply that work is saved until the backend confirms it.\u003c/p>\u003c/section>\u003csection class=\"prose\">\u003ch2>What is established\u003c/h2>\u003cp>Source implements product routes and version-pinning logic, and the repository includes focused regression tests. Those tests were inspected, not executed as part of this portfolio build. The original README includes a build brief and Lovable provenance; its requested features are not treated as shipped outcomes.\u003c/p>\u003c/section>\u003csection class=\"boundary\">\u003cp class=\"eyebrow\">Implementation status\u003c/p>\u003ch2>What still needs verification\u003c/h2>\u003cp>Classified as an application in development. Live deployment, payments, delivery, RSVP completion, production persistence, accessibility, and the full customer journey have not been verified. No customer count or commercial success is claimed.\u003c/p>\u003c/section>\u003csection class=\"prose\">\u003ch2>Implementation evidence\u003c/h2>\u003cp>Private project links require repository access. No private source code, customer records, or credentials are reproduced here.\u003c/p>\u003cul class=\"evidence\">\u003cli>\u003ca href=\"https://github.com/Ladybugverse/everfold-invites/blob/main/src/lib/templates/apply.ts\">Version pinning implementation ↗\u003c/a>\u003csmall>Access restricted · available to authorized reviewers\u003c/small>\u003c/li>\u003cli>\u003ca href=\"https://github.com/Ladybugverse/everfold-invites/blob/main/src/lib/invitations/confirmed-save.test.ts\">Confirmed-save regression tests ↗\u003c/a>\u003csmall>Access restricted · available to authorized reviewers\u003c/small>\u003c/li>\u003cli>\u003ca href=\"https://github.com/Ladybugverse/everfold-invites/blob/main/package.json\">Dependencies and scripts ↗\u003c/a>\u003csmall>Access restricted · available to authorized reviewers\u003c/small>\u003c/li>\u003c/ul>\u003c/section>\u003ca class=\"button\" href=\"../../index.html#contact\">Discuss this work ↗\u003c/a>\u003c/article>\u003c/div>\u003c/main>\u003cfooter>\u003cspan>Tiffany Legg / Operations × Technology\u003c/span>\u003cspan>Parma Heights, Ohio · © 2026\u003c/span>\u003ca href=\"https://github.com/Ladybugverse/personal-website\">Portfolio source ↗\u003c/a>\u003c/footer>","runhouse":"\u003ca class=\"skip\" href=\"#main\">Skip to content\u003c/a>\u003cheader>\u003ca class=\"wordmark\" href=\"../../index.html\" aria-label=\"Tiffany Legg home\">tl\u003cspan> / \u003c/span>Tiffany Legg\u003c/a>\u003cnav aria-label=\"Main navigation\">\u003ca href=\"../../index.html#work\">Selected work\u003c/a>\u003ca href=\"../../index.html#about\">Experience\u003c/a>\u003ca href=\"../../index.html#contact\">Let’s connect ↗\u003c/a>\u003c/nav>\u003c/header>\u003cmain id=\"main\">\u003cdiv class=\"case-hero\">\u003ca class=\"back\" href=\"../../index.html#work\">← All selected work\u003c/a>\u003cp class=\"eyebrow\">Web experience &amp; interaction design\u003c/p>\u003ch1>RunHouse Digital\u003cspan class=\"period\">.\u003c/span>\u003c/h1>\u003cp class=\"lead\">A service-business web experience with a configurable project estimator and transparent cost breakdown.\u003c/p>\u003cspan class=\"status\">Frontend prototype · Deployment unverified\u003c/span>\u003c/div>\u003cdiv class=\"case-grid\">\u003caside>\u003ch2 class=\"eyebrow\">At a glance\u003c/h2>\u003ch3>Role & contribution\u003c/h3>\u003cp>Brand and product initiative. The reviewed repository demonstrates a frontend implementation; precise personal contribution to each component is not established.\u003c/p>\u003ch3>Technology in the source\u003c/h3>\u003cp>React · TypeScript · Vite · Tailwind · Wouter\u003c/p>\u003ch3>Business problem\u003c/h3>\u003cp>Help a prospective client understand how project scope, add-ons, and ongoing maintenance affect an indicative estimate.\u003c/p>\u003cp class=\"micro\">Evidence reviewed October 14, 2026. Source code establishes implementation, not production use.\u003c/p>\u003c/aside>\u003carticle>\u003cdiv class=\"system-map runhouse\" aria-label=\"Conceptual project structure\">\u003cdiv class=\"map-top\">\u003cspan>FIELD NOTES / RUNHOUSE\u003c/span>\u003cspan>↗\u003c/span>\u003c/div>\u003cdiv class=\"map-mark\">R / H\u003c/div>\u003cdiv class=\"map-nodes\">\u003cspan>\u003ci>01\u003c/i>Project package\u003c/span>\u003cspan>\u003ci>02\u003c/i>Optional add-ons\u003c/span>\u003cspan>\u003ci>03\u003c/i>Maintenance\u003c/span>\u003cspan>\u003ci>04\u003c/i>Estimate breakdown\u003c/span>\u003c/div>\u003csmall>Conceptual structure · not an application screenshot\u003c/small>\u003c/div>\u003csection class=\"prose\">\u003ch2>Scope becomes an interaction\u003c/h2>\u003cp>The reviewed ProjectEstimator component lets a visitor choose a project package, toggle add-ons, and select maintenance. It derives a one-time total, monthly amount, and first-year estimate from the current selections.\u003c/p>\u003c/section>\u003csection class=\"prose\">\u003ch2>Separate the pricing decisions\u003c/h2>\u003cp>Package, add-on, and maintenance data are separate collections. Totals are calculated from those records rather than manually repeated across the interface. This is a concrete example of reusable data driving a customer-facing interaction.\u003c/p>\u003c/section>\u003csection class=\"prose\">\u003ch2>A complete presentation structure\u003c/h2>\u003cp>The repository contains home, services, work, case studies, contact, and legal page implementations. This establishes page structure, not verified client engagements or the truth of every marketing claim contained in the source.\u003c/p>\u003c/section>\u003csection class=\"prose\">\u003ch2>Why feature this project\u003c/h2>\u003cp>The estimator is the strongest inspected exhibit: it makes scope tangible and explains a business decision through interaction. It complements Mow Magic’s operational depth and Everfold’s product architecture.\u003c/p>\u003c/section>\u003csection class=\"boundary\">\u003cp class=\"eyebrow\">Implementation status\u003c/p>\u003ch2>What still needs verification\u003c/h2>\u003cp>Classified as a frontend prototype. Pricing is illustrative source configuration, not a current offer. No estimator-to-CRM integration, functioning contact submission, completed client projects, or live deployment is verified. Source marketing metrics are not reused as portfolio evidence.\u003c/p>\u003c/section>\u003csection class=\"prose\">\u003ch2>Implementation evidence\u003c/h2>\u003cp>Private project links require repository access. No private source code, customer records, or credentials are reproduced here.\u003c/p>\u003cul class=\"evidence\">\u003cli>\u003ca href=\"https://github.com/Ladybugverse/Runhouse_digital/blob/main/client/src/components/ProjectEstimator.tsx\">Interactive estimator ↗\u003c/a>\u003csmall>Access restricted · available to authorized reviewers\u003c/small>\u003c/li>\u003cli>\u003ca href=\"https://github.com/Ladybugverse/Runhouse_digital/blob/main/client/src/App.tsx\">Page structure ↗\u003c/a>\u003csmall>Access restricted · available to authorized reviewers\u003c/small>\u003c/li>\u003cli>\u003ca href=\"https://github.com/Ladybugverse/Runhouse_digital/blob/main/package.json\">Build dependencies ↗\u003c/a>\u003csmall>Access restricted · available to authorized reviewers\u003c/small>\u003c/li>\u003c/ul>\u003c/section>\u003ca class=\"button\" href=\"../../index.html#contact\">Discuss this work ↗\u003c/a>\u003c/article>\u003c/div>\u003c/main>\u003cfooter>\u003cspan>Tiffany Legg / Operations × Technology\u003c/span>\u003cspan>Parma Heights, Ohio · © 2026\u003c/span>\u003ca href=\"https://github.com/Ladybugverse/personal-website\">Portfolio source ↗\u003c/a>\u003c/footer>","design-system":"\u003ca class=\"skip\" href=\"#main\">Skip to content\u003c/a>\u003cheader>\u003ca class=\"wordmark\" href=\"../../index.html\" aria-label=\"Tiffany Legg home\">tl\u003cspan> / \u003c/span>Tiffany Legg\u003c/a>\u003cnav aria-label=\"Main navigation\">\u003ca href=\"../../index.html#work\">Selected work\u003c/a>\u003ca href=\"../../index.html#about\">Experience\u003c/a>\u003ca href=\"../../index.html#contact\">Let’s connect ↗\u003c/a>\u003c/nav>\u003c/header>\u003cmain id=\"main\">\u003cdiv class=\"case-hero\">\u003ca class=\"back\" href=\"../../index.html#work\">← All selected work\u003c/a>\u003cp class=\"eyebrow\">Brand systems &amp; maintainability\u003c/p>\u003ch1>Mow Magic Design System\u003cspan class=\"period\">.\u003c/span>\u003c/h1>\u003cp class=\"lead\">A data-free brand layer shared by public marketing and private operational applications.\u003c/p>\u003cspan class=\"status\">Reusable source package · Deployment unverified\u003c/span>\u003c/div>\u003cdiv class=\"case-grid\">\u003caside>\u003ch2 class=\"eyebrow\">At a glance\u003c/h2>\u003ch3>Role & contribution\u003c/h3>\u003cp>Part of Mow Magic’s brand and systems work. Repository documentation supports the reuse strategy; sole component authorship is not claimed.\u003c/p>\u003ch3>Technology in the source\u003c/h3>\u003cp>CSS tokens · Web components · Versioned releases\u003c/p>\u003ch3>Business problem\u003c/h3>\u003cp>Keep a consistent brand across separate applications without mixing customer data or business logic into the shared presentation layer.\u003c/p>\u003cp class=\"micro\">Evidence reviewed October 14, 2026. Source code establishes implementation, not production use.\u003c/p>\u003c/aside>\u003carticle>\u003cdiv class=\"system-map design-system\" aria-label=\"Conceptual project structure\">\u003cdiv class=\"map-top\">\u003cspan>FIELD NOTES / DESIGN-SYSTEM\u003c/span>\u003cspan>↗\u003c/span>\u003c/div>\u003cdiv class=\"map-mark\">Aa\u003c/div>\u003cdiv class=\"map-nodes\">\u003cspan>\u003ci>01\u003c/i>Brand tokens\u003c/span>\u003cspan>\u003ci>02\u003c/i>Presentational layer\u003c/span>\u003cspan>\u003ci>03\u003c/i>Version contract\u003c/span>\u003cspan>\u003ci>04\u003c/i>Application reuse\u003c/span>\u003c/div>\u003csmall>Conceptual structure · not an application screenshot\u003c/small>\u003c/div>\u003csection class=\"prose\">\u003ch2>A useful boundary\u003c/h2>\u003cp>The public package is explicitly limited to logos, color and typography tokens, and presentational components. Its documented boundary excludes credentials, customer and employee data, invoices, schedules, and application-specific business logic.\u003c/p>\u003c/section>\u003csection class=\"prose\">\u003ch2>Reuse with a release contract\u003c/h2>\u003cp>The README documents brand-lockup and status-badge components and requires consumers to pin an immutable semantic version. Breaking changes require a new major version. The team application documents vendoring the v1.0.0 package to avoid a production CDN dependency.\u003c/p>\u003c/section>\u003csection class=\"prose\">\u003ch2>Why it matters\u003c/h2>\u003cp>This is evidence of maintainability thinking: a shared identity layer can evolve independently while application-specific records and workflows stay in their own systems. It extends branding beyond a logo into a repeatable implementation pattern.\u003c/p>\u003c/section>\u003csection class=\"boundary\">\u003cp class=\"eyebrow\">Implementation status\u003c/p>\u003ch2>What still needs verification\u003c/h2>\u003cp>The README and team integration documentation were inspected. Production use, release integrity, visual consistency across deployments, and the rendered components were not independently tested.\u003c/p>\u003c/section>\u003csection class=\"prose\">\u003ch2>Implementation evidence\u003c/h2>\u003cp>Private project links require repository access. No private source code, customer records, or credentials are reproduced here.\u003c/p>\u003cul class=\"evidence\">\u003cli>\u003ca href=\"https://github.com/Ladybugverse/mow-magic-design-system/blob/main/README.md\">Public package and contract ↗\u003c/a>\u003csmall>Public source\u003c/small>\u003c/li>\u003cli>\u003ca href=\"https://github.com/Ladybugverse/mow-magic-team-system/blob/main/README.md\">Team integration documentation ↗\u003c/a>\u003csmall>Access restricted · available to authorized reviewers\u003c/small>\u003c/li>\u003c/ul>\u003c/section>\u003ca class=\"button\" href=\"../../index.html#contact\">Discuss this work ↗\u003c/a>\u003c/article>\u003c/div>\u003c/main>\u003cfooter>\u003cspan>Tiffany Legg / Operations × Technology\u003c/span>\u003cspan>Parma Heights, Ohio · © 2026\u003c/span>\u003ca href=\"https://github.com/Ladybugverse/personal-website\">Portfolio source ↗\u003c/a>\u003c/footer>"};

const frameScript = "\nconst menu = document.createElement('button');\nmenu.className = 'menu-toggle';\nmenu.type = 'button';\nmenu.textContent = 'Menu +';\nmenu.setAttribute('aria-expanded', 'false');\nmenu.setAttribute('aria-controls', 'main-navigation');\nconst nav = document.querySelector('header nav');\nnav.id = 'main-navigation';\ndocument.querySelector('header').append(menu);\nmenu.addEventListener('click', () => {\n  const open = nav.classList.toggle('open');\n  menu.setAttribute('aria-expanded', String(open));\n  menu.textContent = open ? 'Close −' : 'Menu +';\n});\nconst filters = document.querySelector('.filters');\nif (filters) {\n  filters.hidden = false;\n  filters.addEventListener('click', event => {\n    const button = event.target.closest('[data-filter]');\n    if (!button) return;\n    filters.querySelectorAll('button').forEach(item => item.setAttribute('aria-pressed', String(item === button)));\n    const projects = [...document.querySelectorAll('.project')];\n    projects.forEach(project => {\n      project.hidden = button.dataset.filter !== 'all' && !project.dataset.tags.split(' ').includes(button.dataset.filter);\n    });\n    document.querySelector('#filter-result').textContent = projects.filter(project => !project.hidden).length + ' projects shown';\n  });\n}\ndocument.querySelectorAll('.prose').forEach(section => {\n  const heading = section.querySelector('h2');\n  if (!heading || heading.textContent !== 'Implementation evidence') return;\n  const details = document.createElement('details');\n  details.className = 'prose-toggle';\n  const summary = document.createElement('summary');\n  summary.textContent = 'Inspect implementation evidence';\n  details.append(summary);\n  [...section.children].filter(child => child !== heading).forEach(child => details.append(child));\n  section.replaceWith(details);\n});\ndocument.addEventListener('click', event => {\n  const anchor = event.target.closest('a');\n  if (!anchor) return;\n  const href = anchor.getAttribute('href');\n  if (!href || /^(https?:|mailto:)/.test(href)) return;\n  event.preventDefault();\n  const section = href.includes('#') ? href.split('#')[1] : '';\n  const match = href.match(/work\\/(mow-magic|everfold|runhouse|design-system)\\//);\n  const route = match ? match[1] : (href.startsWith('#') ? document.body.dataset.route : 'home');\n  if (route === document.body.dataset.route && section) {\n    document.getElementById(section)?.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });\n    nav.classList.remove('open');\n    menu.setAttribute('aria-expanded', 'false');\n    menu.textContent = 'Menu +';\n  } else {\n    parent.postMessage({ type: 'portfolio-route', route, section }, '*');\n  }\n});\ndocument.querySelectorAll('a[href^=\"https:\"]').forEach(anchor => {\n  anchor.target = '_blank';\n  anchor.rel = 'noopener noreferrer';\n});\nwindow.addEventListener('message', event => {\n  if (event.source !== parent || event.data.type !== 'portfolio-scroll') return;\n  document.getElementById(event.data.section)?.scrollIntoView();\n});\n";
const directions = {
tech: {name:'Bold Creative Technologist',description:'Electric, architectural, precise. Fixed navigation, condensed scale, alternating project stories.',palette:['#101112','#d4ff53','#b0e1f3']},
luxury: {name:'Luxury Editorial',description:'A plum-and-peach collection. Sculptural typography, an arched composition, staggered project gallery.',palette:['#35142b','#edc9ba','#f4eae7']},
studio: {name:'Expressive Digital Studio',description:'A vibrant independent studio. Cobalt type, playful shapes, a featured story and tactile project tiles.',palette:['#151c82','#ffccdf','#ffe171']}
};
const routeNames={home:'Homepage','mow-magic':'Mow Magic',everfold:'Everfold',runhouse:'RunHouse Digital','design-system':'Mow Magic Design System'};
let concept='tech',route='home',section='';
let mode=matchMedia('(max-width:650px)').matches?'mobile':'desktop';
const frames=[];
const stage=document.getElementById('stage'),pageSelect=document.getElementById('page-select'),viewSelect=document.getElementById('view-select');
function readHash(){
const parts=location.hash.slice(1).split('/');
if(directions[parts[0]])concept=parts[0];
route=pages[parts[1]]?parts[1]:'home';section=parts[2]||'';
}
function navigate(nextConcept,nextRoute,nextSection=''){
const hash='#'+nextConcept+'/'+nextRoute+(nextSection?'/'+nextSection:'');
if(location.hash===hash)render();else location.hash=hash;
}
function frameDocument(){
return '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>'+directions[concept].name+' — '+routeNames[route]+'</title><style>'+baseCSS+designCSS+'</style></head><body class="'+concept+'" data-route="'+route+'">'+pages[route]+'<script>'+frameScript+'<'+'/script></body></html>';
}
function addFrame(kind){
const panel=document.createElement('section');panel.className='viewport-panel '+kind;
const label=document.createElement('div');label.className='viewport-label';
label.textContent=kind==='mobile'?'Mobile · 390 px':kind==='desktop'?'Desktop · 1280 px':'Responsive · actual width';
const surface=document.createElement('div');surface.className='viewport-surface';
const iframe=document.createElement('iframe');iframe.title=directions[concept].name+' — '+routeNames[route]+' — '+kind;
iframe.setAttribute('sandbox','allow-scripts allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation');
iframe.srcdoc=frameDocument();surface.append(iframe);panel.append(label,surface);stage.append(panel);
frames.push({iframe,surface,kind,label});
iframe.addEventListener('load',()=>{if(section)iframe.contentWindow.postMessage({type:'portfolio-scroll',section},'*');});
}
function sizeFrames(){
for(const frame of frames){
const available=frame.surface.clientWidth;
const width=frame.kind==='desktop'?1280:frame.kind==='mobile'?390:available;
const scale=Math.min(1,available/width),height=frame.kind==='desktop'?1000:frame.kind==='mobile'?844:900;
frame.iframe.style.width=width+'px';frame.iframe.style.height=height+'px';frame.iframe.style.transform='scale('+scale+')';
frame.surface.style.height=height*scale+'px';
if(frame.kind==='responsive')frame.label.textContent='Responsive · '+Math.round(width)+' px';
}
}
function render(){
readHash();
document.querySelectorAll('[data-concept]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.concept===concept)));
document.getElementById('direction-name').textContent=directions[concept].name;
document.getElementById('direction-description').textContent=directions[concept].description;
const palette=document.getElementById('palette');palette.replaceChildren();
for(const color of directions[concept].palette){const swatch=document.createElement('span');swatch.style.background=color;swatch.title=color;swatch.setAttribute('aria-label',color);palette.append(swatch);}
pageSelect.value=route;viewSelect.value=mode;stage.replaceChildren();frames.length=0;
stage.className=mode==='paired'?'paired':mode;
if(mode==='paired'){addFrame('desktop');addFrame('mobile');}else addFrame(mode);
sizeFrames();document.title=directions[concept].name+' | Tiffany Legg preview';
}
document.querySelectorAll('[data-concept]').forEach(button=>button.addEventListener('click',()=>navigate(button.dataset.concept,route,section)));
pageSelect.addEventListener('change',()=>navigate(concept,pageSelect.value));
viewSelect.addEventListener('change',()=>{mode=viewSelect.value;render();});
window.addEventListener('hashchange',render);window.addEventListener('resize',sizeFrames);
window.addEventListener('message',event=>{
if(!frames.some(frame=>frame.iframe.contentWindow===event.source))return;

navigate(concept,event.data.route,event.data.section||'');
});
document.getElementById('home-button').addEventListener('click',()=>navigate(concept,'home'));
new ResizeObserver(sizeFrames).observe(stage);
render();
